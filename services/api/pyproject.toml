[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-league-api"
version = "0.1.0"
description = "Study League backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.8,<3",
    "pydantic-settings>=2.4",
    "pwdlib[argon2]>=0.2",
    "PyJWT>=2.9",
    "structlog>=24.1",
    "redis>=5.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Linters and type checkers are pinned exactly: a new rule or a formatter change in a
    # patch release turns an unrelated push red. Upgrades are a deliberate commit that also
    # carries whatever fixes the new version demands.
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Ship the py.typed marker so downstream services (the worker) get app's type information.
artifacts = ["app/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "SIM108", # ternary is not always clearer
    # Prose in docstrings and comments uses en dashes and typographic punctuation
    # deliberately; these rules exist to catch homoglyph attacks in identifiers, which
    # the selected rules still cover elsewhere.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are largely generated; their long column definitions are not worth rewrapping.
"alembic/*" = ["I001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true
