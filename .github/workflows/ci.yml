name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study_ci_pw
          POSTGRES_DB: study_league_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U study"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://study:study_ci_pw@localhost:5432/study_league_test
        run: pytest -q
      - name: Migrations apply cleanly (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://study:study_ci_pw@localhost:5432/study_league_test
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Type check (mobile)
        run: npm run --workspace apps/mobile typecheck
      - name: Tests (mobile)
        run: npm run --workspace apps/mobile test -- --ci
      - name: Type check (web)
        run: npm run --workspace apps/web typecheck
      - name: Tests (web)
        run: npm run --workspace apps/web test
