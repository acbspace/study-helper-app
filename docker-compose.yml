name: study-league

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_local_pw
      POSTGRES_DB: study_league
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U study -d study_league']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles: ['full']
    environment:
      STUDY_ENV: local
      DATABASE_URL: postgresql+asyncpg://study:study_local_pw@postgres:5432/study_league
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret-change-me
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ['full']
    environment:
      STUDY_ENV: local
      DATABASE_URL: postgresql+asyncpg://study:study_local_pw@postgres:5432/study_league
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
